<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サキュレ 回収ルート最適化</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--pink:#b51748;--pink-dk:#8f1038;--navy:#1A1A3A;--text:#333;--gray:#666;--border:#e5e7eb;--bg:#f3f4f6;--green:#16a34a;--amber:#d97706;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
.hd{background:var(--navy);padding:12px 16px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.hd-t{font-size:.95rem;font-weight:900;color:#fff;}.hd-t span{color:var(--pink);}
.hd-s{font-size:.67rem;color:rgba(255,255,255,.4);margin-top:1px;}
.tab-nav{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:48px;z-index:999;}
.tab-btn{flex:1;padding:11px 4px;font-size:.78rem;font-weight:700;color:var(--gray);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:.2s;font-family:inherit;}
.tab-btn.active{color:var(--pink);border-bottom-color:var(--pink);}
.view{display:none;padding:14px;}.view.active{display:block;}
.card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.card-ttl{font-size:.73rem;font-weight:800;color:var(--navy);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;padding-left:8px;border-left:3px solid var(--pink);}
.fg{margin-bottom:10px;}.fg:last-child{margin-bottom:0;}
.fl{font-size:.72rem;color:var(--gray);font-weight:600;margin-bottom:4px;display:block;}
.fi{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:.87rem;color:var(--text);outline:none;transition:border-color .2s;font-family:inherit;background:#fff;}
.fi:focus{border-color:var(--pink);}
.fr{display:flex;gap:8px;}.fr .fg{flex:1;margin-bottom:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 14px;border-radius:7px;font-size:.83rem;font-weight:700;cursor:pointer;border:none;transition:.2s;font-family:inherit;}
.btn-pink{background:var(--pink);color:#fff;}.btn-pink:hover{background:var(--pink-dk);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-outline{background:#fff;color:var(--pink);border:1.5px solid var(--pink);}
.btn-red{background:#ef4444;color:#fff;}
.btn-sm{padding:5px 10px;font-size:.73rem;}
.btn-full{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.tg{display:flex;gap:3px;background:#f0f0f0;border-radius:7px;padding:3px;}
.to{flex:1;padding:6px 4px;font-size:.72rem;font-weight:700;border:none;border-radius:5px;cursor:pointer;background:transparent;color:var(--gray);font-family:inherit;transition:.15s;}
.to.active{background:#fff;color:var(--pink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.opt-btn{width:100%;padding:14px;background:var(--pink);color:#fff;font-size:.95rem;font-weight:900;border:none;border-radius:10px;cursor:pointer;letter-spacing:.04em;margin-top:8px;font-family:inherit;transition:.2s;}
.opt-btn:hover{background:var(--pink-dk);}
.opt-btn:disabled{background:#ccc;cursor:not-allowed;}

/* ── 停車地リスト ── */
.stop-search{position:relative;margin-bottom:8px;}
.stop-search-res{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:7px;max-height:220px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.sr-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.83rem;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:#f5f5f5;}
.sr-name{font-weight:700;color:var(--navy);}
.sr-addr{font-size:.72rem;color:var(--gray);margin-top:1px;}
.sel-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.sel-item:last-child{border-bottom:none;}
.sel-num{width:22px;height:22px;border-radius:50%;font-size:.7rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;color:#fff;}
.sel-info{flex:1;min-width:0;}
.sel-name{font-size:.87rem;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sel-addr{font-size:.72rem;color:var(--gray);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sel-tw{font-size:.7rem;color:var(--amber);font-weight:700;margin-top:2px;}
.tw-edit{display:none;background:#fff8e1;border-radius:5px;padding:6px 8px;margin-top:4px;}
.tw-edit.on{display:block;}

/* ── Result ── */
.res-banner{background:var(--navy);color:#fff;border-radius:10px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-around;}
.res-stat .val{font-size:1.1rem;font-weight:900;text-align:center;}
.res-stat .lbl{font-size:.65rem;color:rgba(255,255,255,.55);text-align:center;margin-top:2px;}
.rt-item{padding:9px 0;border-bottom:1px solid var(--border);}
.rt-item:last-child{border-bottom:none;}
.rt-top{display:flex;align-items:flex-start;gap:10px;}
.rt-num{width:24px;height:24px;border-radius:50%;font-size:.7rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.rt-name{font-size:.88rem;font-weight:700;color:var(--navy);}
.rt-addr{font-size:.72rem;color:var(--gray);margin-top:1px;line-height:1.35;}
.rt-time{font-size:.72rem;color:var(--gray);margin-top:3px;}
.rt-tw{font-size:.7rem;color:var(--amber);font-weight:700;margin-top:3px;}
.rt-arrow{padding:3px 0 3px 34px;font-size:.72rem;color:var(--gray);display:flex;align-items:center;gap:4px;}
.rt-arrow .dur{color:var(--pink);font-weight:700;}
.alert{padding:9px 12px;border-radius:7px;font-size:.8rem;margin-bottom:10px;line-height:1.55;}
.alert-w{background:#fef9c3;color:#854d0e;border:1px solid #fde047;}
.alert-e{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
.alert-s{background:#dcfce7;color:#14532d;border:1px solid #86efac;}
.alert-i{background:#eff6ff;color:#1e3a8a;border:1px solid #93c5fd;}
.loading{display:none;flex-direction:column;align-items:center;gap:10px;padding:28px;color:var(--gray);font-size:.83rem;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--pink);border-radius:3px;transition:width .3s;}
#map{width:100%;height:260px;border-radius:8px;margin-bottom:8px;}
.gmaps-full{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:#4285F4;color:#fff;border-radius:7px;text-decoration:none;font-size:.85rem;font-weight:700;margin-top:8px;}
.gmaps-seg{display:flex;align-items:center;padding:9px 12px;background:#f5f5f5;border-radius:7px;text-decoration:none;color:var(--text);font-size:.8rem;margin-bottom:6px;}
.gmaps-seg:hover{background:#ebebeb;}
.gmaps-seg-num{font-size:.7rem;font-weight:900;color:var(--pink);min-width:52px;}
.gmaps-seg-lbl{flex:1;font-weight:600;font-size:.78rem;}
.gmaps-seg-ic{color:var(--pink);}
.m-item{background:#fff;border-radius:8px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.m-name{font-size:.88rem;font-weight:700;color:var(--navy);}
.m-addr{font-size:.72rem;color:var(--gray);margin-top:2px;line-height:1.35;}
.m-notes{font-size:.7rem;color:var(--amber);margin-top:2px;}
.m-ok{font-size:.67rem;color:var(--green);margin-top:2px;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:.68rem;font-weight:700;}
.bdg-pink{background:#fff0f3;color:var(--pink);}
.bdg-navy{background:#eef0fa;color:var(--navy);}
.bdg-amber{background:#fffbeb;color:var(--amber);}
.empty{text-align:center;padding:24px 16px;color:var(--gray);}
.empty .ico{font-size:2rem;margin-bottom:8px;}
.empty p{font-size:.82rem;line-height:1.7;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sh-ttl{font-size:.92rem;font-weight:800;color:var(--navy);}
.custom-form{background:#f9f9f9;border:1.5px dashed var(--border);border-radius:8px;padding:12px;margin-top:8px;}
.tpl-badge{display:inline-flex;align-items:center;gap:4px;background:#eef0fa;border-radius:5px;padding:4px 8px;font-size:.73rem;font-weight:700;color:var(--navy);margin-bottom:8px;}
.mlist-search{margin-bottom:10px;}
@media(max-width:400px){.fr{flex-direction:column;gap:0;}.fr .fg{margin-bottom:8px;}}

/* ── ドライブモード ── */
.drv-overlay{position:fixed;inset:0;background:#f3f4f6;z-index:3000;display:none;flex-direction:column;overflow:hidden;}
.drv-hd{background:var(--navy);color:#fff;padding:10px 16px 8px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.drv-hd-row{display:flex;align-items:center;gap:10px;}
.drv-hd-title{flex:1;font-size:.9rem;font-weight:900;}
.drv-prog{font-size:.75rem;color:rgba(255,255,255,.7);white-space:nowrap;}
.drv-close{padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;}
.drv-prog-bar{height:3px;background:rgba(255,255,255,.18);border-radius:2px;}
.drv-prog-fill{height:100%;background:var(--pink);border-radius:2px;transition:width .35s;}
.drv-body{flex:1;overflow-y:auto;padding:8px 12px 12px;}
.drv-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;margin-bottom:6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.07);transition:.2s;border:2px solid transparent;}
.drv-item.drv-done{opacity:.55;background:#f9fafb;}
.drv-item.drv-late:not(.drv-next){border-color:var(--amber);background:#fffbeb;}
.drv-item.drv-next.drv-late{border-color:var(--amber);box-shadow:0 2px 14px rgba(217,119,6,.3);}
.drv-undo{font-size:.55rem;color:var(--green);font-weight:700;margin-top:3px;text-align:center;}
.drv-arr-late{color:#b45309 !important;font-weight:800 !important;}
.drv-late-badge{font-size:.62rem;font-weight:900;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:4px;padding:2px 7px;margin-top:3px;display:inline-block;}
/* メモ */
.drv-memo-row{margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;}
.drv-memo-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
.drv-memo-chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s;}
.drv-memo-chip.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.drv-memo-input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:.83rem;font-family:inherit;outline:none;background:#fff;}
.drv-memo-input:focus{border-color:var(--pink);}
.drv-item.drv-next{border-color:var(--pink);box-shadow:0 2px 14px rgba(181,23,72,.22);}
.drv-chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:#fff;font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
.drv-chk.drv-chk-on{background:var(--green);border-color:var(--green);color:#fff;}
.drv-num{font-size:.65rem;font-weight:900;color:var(--pink);margin-bottom:1px;}
.drv-info{flex:1;min-width:0;}
.drv-name{font-size:.9rem;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.drv-addr{font-size:.72rem;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.drv-tw{font-size:.7rem;color:var(--amber);font-weight:700;margin-top:2px;}
.drv-arr{font-size:.68rem;color:var(--amber);font-weight:700;margin-top:2px;}
.drv-notes{font-size:.7rem;color:#059669;font-weight:600;margin-top:2px;}
.drv-weight{font-size:.68rem;color:var(--gray);margin-top:1px;}
.drv-nav-btn{width:52px;height:52px;border-radius:10px;background:#f0f0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-size:.58rem;color:var(--gray);flex-shrink:0;gap:2px;font-weight:700;transition:.15s;border:2px solid transparent;}
.drv-nav-btn.drv-nav-next{background:var(--pink);color:#fff;border-color:var(--pink);}
.drv-nav-btn span{font-size:1.1rem;line-height:1;}
.drv-item.drv-next{flex-direction:column;align-items:stretch;gap:0;}
.drv-next-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.drv-complete-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;box-shadow:0 2px 10px rgba(22,163,74,.3);transition:.15s;}
.drv-complete-btn:active{filter:brightness(.9);}
@media(min-width:768px){.drv-complete-btn{font-size:1.05rem;padding:15px;}}
.drv-summary-title{font-size:1.1rem;font-weight:900;color:var(--green);text-align:center;margin-bottom:14px;}
.drv-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin-bottom:14px;}
.drv-summary-item{background:#fff;border-radius:8px;padding:10px 6px;text-align:center;}
.drv-summary-val{font-size:1.05rem;font-weight:900;color:var(--navy);}
.drv-summary-lbl{font-size:.62rem;color:var(--gray);margin-top:2px;}
.drv-summary-notes{margin-bottom:12px;}
.drv-summary-note{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:.82rem;}
.drv-summary-note-name{color:var(--navy);font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;}
.drv-summary-note-memo{background:#eef0fa;color:var(--navy);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;flex-shrink:0;}
.drv-copy-btn{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;}
.drv-copy-btn:active{opacity:.8;}
.drv-copy-ok{font-size:.75rem;color:var(--green);font-weight:700;text-align:center;margin-top:6px;display:none;}
/* 次の停車地フッター */
.drv-footer{background:#fff;border-top:2px solid var(--border);padding:12px 14px;flex-shrink:0;box-shadow:0 -3px 12px rgba(0,0,0,.1);}
.drv-footer-next{display:flex;align-items:center;gap:10px;}
.drv-footer-label{font-size:.58rem;font-weight:900;color:var(--pink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.drv-footer-name{font-size:.92rem;font-weight:900;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.drv-footer-sub{font-size:.7rem;color:var(--gray);}
.drv-footer-info{flex:1;min-width:0;}
.drv-footer-navbtn{min-width:72px;padding:12px 16px;background:var(--pink);color:#fff;border-radius:10px;text-decoration:none;font-size:.9rem;font-weight:900;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;box-shadow:0 3px 12px rgba(181,23,72,.28);}
.drv-footer-done{text-align:center;color:var(--green);font-weight:900;font-size:.88rem;}
.drv-start-btn{position:sticky;bottom:12px;left:0;right:0;display:flex;justify-content:center;margin-top:10px;}
.drv-start-btn a,.drv-start-btn button{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 24px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 16px rgba(22,163,74,.35);font-family:inherit;text-decoration:none;}

/* ── タブレット対応 (768px以上) ── */
@media(min-width:768px){
  .drv-hd{padding:14px 24px 10px;}
  .drv-hd-title{font-size:1rem;}
  .drv-body{padding:12px 24px 12px;}
  .drv-item{padding:14px 14px;gap:14px;}
  .drv-chk{width:44px;height:44px;font-size:1.3rem;}
  .drv-name{font-size:1rem;}
  .drv-addr{font-size:.8rem;}
  .drv-tw{font-size:.78rem;}
  .drv-arr{font-size:.75rem;}
  .drv-notes{font-size:.78rem;}
  .drv-nav-btn{width:60px;height:60px;font-size:.65rem;}
  .drv-nav-btn span{font-size:1.3rem;}
  .drv-footer{padding:14px 24px;}
  .drv-footer-name{font-size:1rem;}
  .drv-footer-navbtn{min-width:84px;font-size:.95rem;}

  body{padding-bottom:80px;}
  .hd{padding:14px 24px;}
  .hd-t{font-size:1.1rem;}
  .hd-s{font-size:.75rem;}
  .tab-btn{font-size:.9rem;padding:14px 8px;}
  .view{padding:20px 24px;max-width:860px;margin:0 auto;}
  .card{padding:18px 20px;margin-bottom:16px;}
  .card-ttl{font-size:.82rem;}
  .fl{font-size:.8rem;}
  .fi{font-size:.95rem;padding:11px 13px;}
  select.fi{font-size:.95rem;}
  .btn{font-size:.92rem;padding:10px 18px;}
  .btn-sm{font-size:.8rem;padding:7px 13px;}
  .opt-btn{font-size:1.05rem;padding:16px;}
  .sel-name{font-size:.95rem;}
  .sel-addr{font-size:.8rem;}
  .sel-tw{font-size:.78rem;}
  .sr-item{padding:11px 14px;font-size:.9rem;}
  .sr-addr{font-size:.8rem;}
  .rt-name{font-size:.96rem;}
  .rt-addr{font-size:.8rem;}
  .rt-time{font-size:.8rem;}
  .rt-tw{font-size:.78rem;}
  .rt-arrow{font-size:.8rem;}
  .res-stat .val{font-size:1.25rem;}
  .res-stat .lbl{font-size:.73rem;}
  .alert{font-size:.88rem;padding:12px 16px;}
  #map{height:400px;}
  .gmaps-full{font-size:.95rem;padding:14px;}
  .gmaps-seg{padding:11px 16px;font-size:.88rem;}
  .m-name{font-size:.96rem;}
  .m-addr{font-size:.8rem;}
  .m-notes{font-size:.78rem;}
  .m-ok{font-size:.75rem;}
  .sh-ttl{font-size:1rem;}
}

/* ── デスクトップ (1100px以上) ── */
@media(min-width:1100px){
  .view{padding:24px 32px;max-width:960px;}
  #map{height:480px;}
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-t">サキュレ <span>回収ルート最適化</span></div>
  <div class="hd-s">拠点500件・39ルート対応</div>
</header>
<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('route')">🗺️ 今日のルート</button>
  <button class="tab-btn" onclick="switchTab('master')">📍 拠点マスタ</button>
  <button class="tab-btn" onclick="switchTab('templates')">📋 ルート一覧</button>
</nav>

<!-- ═══ VIEW: 今日のルート ═══ -->
<div class="view active" id="view-route">

  <!-- テンプレート -->
  <div class="card">
    <div class="card-ttl">テンプレートから読み込む</div>
    <div class="fr">
      <div class="fg">
        <label class="fl">ドライバー</label>
        <select class="fi" id="tpl-driver" onchange="onDriverChange()">
          <option value="">-- 選択 --</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">曜日</label>
        <select class="fi" id="tpl-day">
          <option value="">-- 曜日 --</option>
        </select>
      </div>
    </div>
    <button class="btn btn-navy btn-full" style="margin-top:8px;" onclick="loadTemplate()">📋 このルートを読み込む</button>
    <div id="tpl-status" style="margin-top:6px;font-size:.75rem;color:var(--gray);"></div>
  </div>

  <!-- 時刻 -->
  <div class="card">
    <div class="card-ttl">時刻設定</div>
    <div class="fr">
      <div class="fg">
        <label class="fl">出発時刻</label>
        <input class="fi" id="depart-time" type="time" value="09:00">
      </div>
      <div class="fg">
        <label class="fl">各拠点の滞在時間（分）</label>
        <input class="fi" id="def-dur" type="number" value="5" min="1" max="60">
      </div>
    </div>
  </div>

<script>
'use strict';

const DAY_ORDER = {月:1,火:2,水:3,木:4,金:5,土:6,日:7};
const LARGE_ROUTE = 50; // これ以上は時間順表示

const S = {
  locs: [],
  stops: [],         // [{id,name,address,lat,lng,twStart,twEnd,dur,isCustom,templateTime,weight}]
  map: null,
  geoCache: {}
};

// ═══════════ STORAGE ═══════════
function loadStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('sacure_v3') || '{}');
    S.locs = d.locs || [];
    S.geoCache = d.geoCache || {};
  } catch(e) { S.locs = []; S.geoCache = {}; }
}
function saveStorage() {
  try {
    localStorage.setItem('sacure_v3', JSON.stringify({ locs: S.locs, geoCache: S.geoCache }));
  } catch(e) {}
}

// ═══════════ IMPORT FROM SACURE_DATA ═══════════
function importMasterData() {
  if (!SACURE_DATA?.locations) return;
  // 既存IDを保持しながらマージ
  const existingIds = new Set(S.locs.map(l => l.id));
  let added = 0;
  for (const loc of SACURE_DATA.locations) {
    if (!existingIds.has(loc.id)) {
      S.locs.push({ ...loc, lat: loc.lat || null, lng: loc.lng || null });
      added++;
    }
  }
  if (added > 0) {
    saveStorage();
    console.log(`マスタデータインポート: ${added}件追加`);
  }
}

// ═══════════ GEOCODING ═══════════
const sleep = ms => new Promise(r => setTimeout(r, ms));

function normalizeAddr(addr) {
  // 全角数字→半角、路線名プレフィックス除去
  return addr
    .replace(/^(新宿線|大江戸線|浅草線|三田線|都営)/, '')
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/－/g, '-')
    .trim();
}

async function nominatimSearch(q) {
  await sleep(350);
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=jp&accept-language=ja`;
  const resp = await fetch(url, { headers: {'User-Agent':'SacureRoute/1.0','Accept-Language':'ja'} });
  const data = await resp.json();
  return data.length ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
}

async function geocode(addr) {
  if (S.geoCache[addr]) return S.geoCache[addr];
  const loc = S.locs.find(l => l.address === addr && l.lat);
  if (loc) { S.geoCache[addr] = {lat:loc.lat, lng:loc.lng}; return S.geoCache[addr]; }

  const base = normalizeAddr(addr);

  // フォールバック候補を順番に試す
  const candidates = [
    base + ' 日本',
    // 番地を除去（例: 2-17-5 → 除去）
    base.replace(/\s*\d+-\d+-\d+\s*$/, '').trim() + ' 日本',
    // 丁目以降を除去
    base.replace(/\s*\d+丁目.*$/, '').trim() + ' 日本',
    // 数字をすべて除去してエリア名だけ
    base.replace(/[\d-]+/g, '').replace(/\s+/g, ' ').trim() + ' 日本',
  ].filter((q, i, arr) => q.trim() !== '日本' && arr.indexOf(q) === i); // 重複除去

  for (const q of candidates) {
    const pt = await nominatimSearch(q);
    if (pt) {
      S.geoCache[addr] = pt;
      const ml = S.locs.find(l => l.address === addr);
      if (ml && !ml.lat) { ml.lat=pt.lat; ml.lng=pt.lng; }
      return pt;
    }
  }

  throw new Error(`住所が見つかりませんでした：「${addr.slice(0,30)}」\n→ 数字は半角・都道府県から入力してください`);
}

// ═══════════ OSRM MATRIX ═══════════
async function getMatrix(pts) {
  const coords = pts.map(p => `${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (data.code !== 'Ok') throw new Error('ルート計算サービスへの接続に失敗しました。再試行してください。');
  return data.durations.map(row => row.map(v => v ?? 999999));
}

// ═══════════ OPTIMIZATION ═══════════
function t2m(t) { if (!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function m2t(m) { const h=Math.floor(m/60)%24; return `${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function fmtSec(s) { const m=Math.round(s/60); return m<60?`${m}分`:`${Math.floor(m/60)}時間${m%60}分`; }

function optimize(stops, mat, departStr, defDur) {
  const n = stops.length, SI=0, EI=n+1;
  const dep = t2m(departStr)||540;
  const fixed = stops.filter(s=>s.twEnd).map(s=>({...s}));
  const free  = stops.filter(s=>!s.twEnd).map(s=>({...s}));
  fixed.sort((a,b)=>t2m(a.twEnd)-t2m(b.twEnd));
  let route=[...fixed];
  for (const stop of free) {
    let best=Infinity, pos=0;
    for (let i=0;i<=route.length;i++) {
      const pi=i===0?SI:route[i-1].mi, ni=i===route.length?EI:route[i].mi;
      const c=mat[pi][stop.mi]+mat[stop.mi][ni]-mat[pi][ni];
      if(c<best){best=c;pos=i;}
    }
    route.splice(pos,0,stop);
  }
  // 2-opt
  let improved=true, iters=0;
  while(improved&&iters<60){
    improved=false;iters++;
    outer:for(let i=0;i<route.length-1;i++){
      for(let j=i+1;j<route.length;j++){
        const a=i===0?SI:route[i-1].mi, b=route[i].mi, c=route[j].mi, d=j===route.length-1?EI:route[j+1].mi;
        if(mat[a][b]+mat[c][d]>mat[a][c]+mat[b][d]+10){
          route.splice(i,j-i+1,...route.slice(i,j+1).reverse());
          improved=true;break outer;
        }
      }
    }
  }
  return calcTimings(route, mat, dep, defDur, SI, EI);
}

function calcTimings(route, mat, dep, defDur, SI, EI) {
  let cur=dep, prev=SI, totalSec=0;
  const timings=[];
  for (const stop of route) {
    const sec=mat[prev][stop.mi]||0;
    totalSec+=sec;
    cur+=Math.round(sec/60);
    const arr=cur;
    let warn=null;
    if(stop.twStart&&cur<t2m(stop.twStart)) cur=t2m(stop.twStart);
    if(stop.twEnd&&cur>t2m(stop.twEnd)) warn=`⚠️ ${stop.twEnd}までの時間指定に間に合わない可能性があります`;
    const dep2=cur+(stop.dur||defDur);
    timings.push({stop,arr,dep:dep2,driveSec:sec,warn});
    cur=dep2; prev=stop.mi;
  }
  const lastSec=mat[prev][EI]||0;
  totalSec+=lastSec;
  return {route,timings,totalSec,lastSec,endArr:cur+Math.round(lastSec/60)};
}

// 時間順表示用（大規模ルート）
function timeOrderedResult(stops, departStr, defDur, startPt, endPt) {
  const dep=t2m(departStr)||540, defD=defDur||5;
  let cur=dep;
  const timings=[];
  for (const stop of stops) {
    const arr=cur, warn=null;
    if(stop.twStart&&cur<t2m(stop.twStart)) cur=t2m(stop.twStart);
    let warnMsg=null;
    if(stop.twEnd&&cur>t2m(stop.twEnd)) warnMsg=`⚠️ ${stop.twEnd}までの時間指定に注意`;
    const dep2=cur+defD;
    timings.push({stop,arr,dep:dep2,driveSec:null,warn:warnMsg});
    cur=dep2;
  }
  return {route:stops,timings,totalSec:null,lastSec:null,endArr:cur,timeOrdered:true};
}


// ═══════════ TEMPLATE ═══════════
function populateDriverSel() {
  if(!SACURE_DATA?.routes)return;
  const sel=document.getElementById('tpl-driver');
  const drivers=[...new Set(SACURE_DATA.routes.map(r=>r.driver))].sort();
  drivers.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
}
function onDriverChange() {
  const driver=document.getElementById('tpl-driver').value;
  const daySel=document.getElementById('tpl-day');
  daySel.innerHTML='<option value="">-- 曜日 --</option>';
  if(!driver)return;
  const days=SACURE_DATA.routes.filter(r=>r.driver===driver).map(r=>r.day);
  days.sort((a,b)=>(DAY_ORDER[a]||9)-(DAY_ORDER[b]||9));
  days.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=`${d}曜日`;daySel.appendChild(o);});
  const todayKanji=['日','月','火','水','木','金','土'][new Date().getDay()];
  if(days.includes(todayKanji)) daySel.value=todayKanji;
}
function loadTemplate() {
  const driver=document.getElementById('tpl-driver').value;
  const day=document.getElementById('tpl-day').value;
  if(!driver||!day){alert('ドライバーと曜日を選択してください');return;}
  const tpl=SACURE_DATA.routes.find(r=>r.driver===driver&&r.day===day);
  if(!tpl){alert('ルートが見つかりません');return;}
  S.stops=[];
  let found=0, missing=0;
  for(const ts of tpl.stops){
    const loc=S.locs.find(l=>l.id===ts.locId);
    if(!loc){missing++;continue;}
    S.stops.push({
      id:loc.id,name:loc.name,address:loc.address,lat:loc.lat||null,lng:loc.lng||null,
      notes:loc.notes||'',twStart:ts.twStart,twEnd:ts.twEnd,
      dur:parseInt(document.getElementById('def-dur').value)||5,
      isCustom:false,templateTime:ts.time,weight:ts.weight
    });
    found++;
  }
  const statusEl=document.getElementById('tpl-status');
  statusEl.textContent=`✅ ${tpl.label}を読み込みました（${found}件）${missing?`・${missing}件見つからず`:''}`;
  // 出発時刻を最初の停車地の15分前にセット
  if(S.stops.length>0&&S.stops[0].twEnd){
    const firstTime=t2m(S.stops[0].templateTime)||t2m(S.stops[0].twEnd);
    if(firstTime){
      const depart=Math.max(firstTime-20,0);
      document.getElementById('depart-time').value=m2t(depart);
    }
  }
  renderSel();
}

// ═══════════ STOP SEARCH & ADD ═══════════
function searchStop(q) {
  const res=document.getElementById('stop-search-res');
  if(!q||q.length<1){res.style.display='none';return;}
  const hits=S.locs.filter(l=>l.name.includes(q)||l.address.includes(q)).slice(0,10);
  if(!hits.length){res.style.display='none';return;}
  res.style.display='block';
  res.innerHTML=hits.map(l=>{
    const inList=S.stops.find(s=>s.id===l.id);
    return `<div class="sr-item" onclick="addFromSearch('${l.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><div class="sr-name">${esc(l.name)}</div><div class="sr-addr">${esc(l.address)}</div></div>
        ${inList?'<span style="color:var(--green);font-size:.7rem;font-weight:700;">追加済み</span>':'<span style="color:var(--pink);font-size:.72rem;font-weight:700;">＋ 追加</span>'}
      </div></div>`;
  }).join('');
}
function addFromSearch(id) {
  const loc=S.locs.find(l=>l.id===id);
  if(!loc)return;
  if(S.stops.find(s=>s.id===id)){
    document.getElementById('stop-search-inp').value='';
    document.getElementById('stop-search-res').style.display='none';
    return;
  }
  S.stops.push({
    id:loc.id,name:loc.name,address:loc.address,lat:loc.lat||null,lng:loc.lng||null,
    notes:loc.notes||'',twStart:null,twEnd:null,dur:parseInt(document.getElementById('def-dur').value)||5,isCustom:false
  });
  document.getElementById('stop-search-inp').value='';
  document.getElementById('stop-search-res').style.display='none';
  renderSel();
}
function toggleCustomForm(){const f=document.getElementById('custom-form');f.style.display=f.style.display==='none'?'block':'none';}
function toggleCustomTW(){document.getElementById('c-tw-fields').style.display=document.getElementById('c-tw-chk').checked?'block':'none';}
function addCustomStop(){
  const name=document.getElementById('c-name').value.trim(),addr=document.getElementById('c-addr').value.trim();
  if(!name||!addr){alert('地点名と住所を入力してください');return;}
  const twChk=document.getElementById('c-tw-chk').checked;
  S.stops.push({
    id:'c_'+Date.now(),name,address:addr,lat:null,lng:null,
    twStart:twChk?document.getElementById('c-tw-s').value||null:null,
    twEnd:twChk?document.getElementById('c-tw-e').value||null:null,
    dur:parseInt(document.getElementById('def-dur').value)||5,isCustom:true
  });
  ['c-name','c-addr'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('c-tw-chk').checked=false;
  document.getElementById('c-tw-fields').style.display='none';
  document.getElementById('custom-form').style.display='none';
  renderSel();
}
function clearStops(){if(confirm('停車地を全てクリアしますか？')){S.stops=[];renderSel();}}

function renderSel(){
  const card=document.getElementById('sel-card'),list=document.getElementById('sel-list');
  document.getElementById('sel-count').textContent=`${S.stops.length}件`;
  if(!S.stops.length){card.style.display='none';return;}
  card.style.display='block';
  list.innerHTML=S.stops.map((s,i)=>`
    <div class="sel-item">
      <div class="sel-num" style="background:var(--pink);">${i+1}</div>
      <div class="sel-info">
        <div class="sel-name">${esc(s.name)}</div>
        <div class="sel-addr">${esc(s.address)}</div>
        ${s.templateTime?`<div class="sel-tw">🕐 ${s.templateTime}${s.twEnd?' (指定: 〜'+s.twEnd+')':''}</div>`:
          s.twEnd?`<div class="sel-tw">⏰ ${s.twStart?s.twStart+'〜':''}${s.twEnd}まで</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
        <button class="btn btn-sm" style="background:#f0f0f0;color:var(--amber);font-size:.68rem;" onclick="toggleTWEdit(${i})">⏰</button>
        <button class="btn btn-red btn-sm" onclick="removeSel(${i})">✕</button>
      </div>
    </div>
    <div class="tw-edit" id="tw-edit-${i}">
      <div style="font-size:.72rem;color:var(--amber);font-weight:700;margin-bottom:4px;">時間指定を編集</div>
      <div style="display:flex;gap:8px;align-items:center;font-size:.75rem;">
        <span>以降</span>
        <input type="time" class="fi" style="width:auto;padding:4px 7px;" value="${s.twStart||''}" onchange="updSelTW(${i},'start',this.value)">
        <span>〜 までに</span>
        <input type="time" class="fi" style="width:auto;padding:4px 7px;" value="${s.twEnd||''}" onchange="updSelTW(${i},'end',this.value)">
      </div>
    </div>`).join('');
}
function toggleTWEdit(i){document.getElementById(`tw-edit-${i}`)?.classList.toggle('on');}
function updSelTW(i,type,val){if(S.stops[i])S.stops[i][type==='start'?'twStart':'twEnd']=val||null;}
function removeSel(i){S.stops.splice(i,1);renderSel();}

// ═══════════ MAIN OPTIMIZE ═══════════
async function startOptimize(){
  if(!S.stops.length){alert('停車地を追加してください');return;}

  showLoad('住所を確認中...',0);
  document.getElementById('result-sec').style.display='none';
  const defDur=parseInt(document.getElementById('def-dur').value)||5;
  const departStr=document.getElementById('depart-time').value;
  const isLarge=S.stops.length>LARGE_ROUTE;

  try {
    // 停車地ジオコーディング
    const stops=[...S.stops];
    for(let i=0;i<stops.length;i++){
      const s=stops[i];
      if(!s.lat){
        setLoad(`住所を確認中... ${i+1}/${stops.length}`,10+Math.round(i/stops.length*70));
        try {
          const gc=await geocode(s.address);
          s.lat=gc.lat;s.lng=gc.lng;
          if(!s.isCustom){const ml=S.locs.find(l=>l.id===s.id);if(ml){ml.lat=gc.lat;ml.lng=gc.lng;}}
        } catch(e){
          console.warn('ジオコーディング失敗:', s.name, e.message);
        }
      }
    }
    saveStorage();

    const geocodedStops=stops.filter(s=>s.lat);
    const failedStops=stops.filter(s=>!s.lat);

    if(geocodedStops.length<1){hideLoad();alert('地図情報の取得に失敗しました。住所を確認してください。');return;}

    // 最初の停車地を内部計算の基点として使用
    const depotPt={...geocodedStops[0]};

    let result;
    if(isLarge){
      setLoad(`${stops.length}件のルートを整理中...`,80);
      result=timeOrderedResult(stops,departStr,defDur,depotPt,depotPt);
    } else {
      const allPts=[depotPt,...stops,depotPt];
      setLoad('ルートを計算中...',80);
      const mat=await getMatrix(allPts.map(p=>({lat:p.lat||35.68,lng:p.lng||139.76})));
      const stopsWI=stops.map((s,i)=>({...s,mi:i+1}));
      result=optimize(stopsWI,mat,departStr,defDur);
    }

    hideLoad();
    renderResult(result,departStr,failedStops,geocodedStops,isLarge);
  } catch(e){
    hideLoad();
    alert('エラー: '+e.message);
    console.error(e);
  }
}

function showLoad(msg,pct){
  document.getElementById('loading').style.display='flex';
  document.getElementById('load-msg').textContent=msg;
  document.getElementById('prog-fill').style.width=(pct||0)+'%';
  document.getElementById('opt-btn').disabled=true;
  document.getElementById('inline-err').style.display='none';
}
function setLoad(msg,pct){document.getElementById('load-msg').textContent=msg;if(pct!=null)document.getElementById('prog-fill').style.width=pct+'%';}
function hideLoad(){
  document.getElementById('loading').style.display='none';
  document.getElementById('opt-btn').disabled=false;
  document.getElementById('prog-fill').style.width='100%';
}
function showInlineError(msg){
  const el=document.getElementById('inline-err');
  el.textContent='❌ '+msg;
  el.style.display='block';
}

// ═══════════ RENDER RESULT ═══════════
function renderResult(res,departStr,failedStops,geocodedStops,isLarge){
  const {route,timings,totalSec,lastSec,endArr,timeOrdered}=res;
  document.getElementById('result-sec').style.display='block';
  // Save for drive mode
  S._driveRoute=route;
  S._timings=timings||null;
  document.getElementById('drv-start-wrap').style.display='flex';

  // Banner
  document.getElementById('res-banner').innerHTML=`
    <div class="res-stat"><div class="val">${route.length}件</div><div class="lbl">停車地</div></div>
    <div class="res-stat"><div class="val">${totalSec?fmtSec(totalSec):'—'}</div><div class="lbl">走行時間</div></div>
    <div class="res-stat"><div class="val">${m2t(endArr)}</div><div class="lbl">完了予定</div></div>`;

  if(isLarge){
    document.getElementById('res-banner').insertAdjacentHTML('afterend',
      `<div class="alert alert-i" style="margin-bottom:8px;">📋 ${route.length}件以上のため時刻順で表示しています。個別に停車地を追加した場合のみ最適化計算を行います。</div>`);
  }
  if(failedStops?.length){
    document.getElementById('res-banner').insertAdjacentHTML('afterend',
      `<div class="alert alert-w" style="margin-bottom:8px;">⚠️ 住所を取得できなかった${failedStops.length}件は地図に表示されません：${failedStops.map(s=>esc(s.name)).join('、')}</div>`);
  }

  // Route list
  let html='';

  timings.forEach((t,i)=>{
    const {stop,arr,dep,driveSec,warn}=t;
    if(driveSec!==null) html+=`<div class="rt-arrow">↓ <span class="dur">${fmtSec(driveSec)}</span></div>`;
    else html+=`<div class="rt-arrow">↓</div>`;
    const navUrl=stop.lat?`https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}&travelmode=driving`:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(stop.address)}&travelmode=driving`;
    html+=`<div class="rt-item"><div class="rt-top">
      <div class="rt-num" style="background:var(--pink);">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div class="rt-name">${esc(stop.name)}</div>
        <div class="rt-addr">${esc(stop.address.slice(0,40))}</div>
        ${stop.templateTime?`<div class="rt-tw">🕐 予定時刻: ${stop.templateTime}</div>`:''}
        ${stop.twEnd&&!stop.templateTime?`<div class="rt-tw">⏰ ${stop.twStart?stop.twStart+'〜':''}${stop.twEnd}まで</div>`:''}
        ${stop.weight?`<div style="font-size:.68rem;color:var(--gray);">収集重量: ${stop.weight}kg</div>`:''}
        <div class="rt-time">到着予定: ${m2t(arr)} ／ 出発: ${m2t(dep)}</div>
        ${warn?`<div class="alert alert-w" style="margin-top:4px;padding:5px 8px;">${warn}</div>`:''}
      </div>
      <a href="${navUrl}" target="_blank" rel="noopener" class="drv-nav-btn" title="Googleマップでナビ"><span>📍</span>ナビ</a>
      </div></div>`;
  });
  document.getElementById('res-route').innerHTML=html;

  // Map
  if(geocodedStops.length>0){
    document.getElementById('map-card').style.display='block';
    renderMap(route);
  } else {
    document.getElementById('map-card').style.display='none';
  }

  renderNav(route);
  document.getElementById('result-sec').scrollIntoView({behavior:'smooth',block:'start'});
}

// ═══════════ MAP ═══════════
function renderMap(route){
  if(S.map){S.map.remove();S.map=null;}
  const map=L.map('map');S.map=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
  const pts=[];
  const mkIcon=(label,bg)=>L.divIcon({
    html:`<div style="background:${bg};color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);">${label}</div>`,
    className:'',iconSize:[26,26],iconAnchor:[13,13]
  });
  route.forEach((s,i)=>{
    if(!s.lat)return;
    L.marker([s.lat,s.lng],{icon:mkIcon(i+1,'#b51748')}).bindPopup(`<b>${i+1}. ${esc(s.name)}</b><br>${esc(s.address)}${s.templateTime?'<br>🕐 '+esc(s.templateTime):s.twEnd?'<br>⏰ '+esc(s.twEnd)+'まで':''}`).addTo(map);
    pts.push([s.lat,s.lng]);
  });
  if(pts.length>1)L.polyline(pts,{color:'#b51748',weight:3,opacity:.65,dashArray:'6,4'}).addTo(map);
  if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[24,24]});
}

// ═══════════ NAV LINKS ═══════════
function renderNav(route){
  const all=route.filter(p=>p.lat);
  if(all.length<2){document.getElementById('nav-links').innerHTML='<div class="alert alert-w">地図情報が取得できなかったためナビリンクを生成できませんでした。</div>';return;}
  const MAX=9;const links=[];
  let i=0;
  while(i<all.length-1){
    const from=all[i],toIdx=Math.min(i+MAX,all.length-1),to=all[toIdx];
    const wps=all.slice(i+1,toIdx);
    const wpStr=wps.map(p=>`${p.lat},${p.lng}`).join('|');
    let url=`https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${to.lat},${to.lng}&travelmode=driving`;
    if(wpStr)url+=`&waypoints=${wpStr}`;
    links.push({url,label:`${from.name} → ${to.name}`});
    i=toIdx;if(i>=all.length-1)break;
  }
  let html='';
  if(links.length===1) html=`<a href="${links[0].url}" target="_blank" rel="noopener" class="gmaps-full">🗺️ Googleマップで全ルートを開く</a>`;
  else links.forEach((lk,idx)=>{html+=`<a href="${lk.url}" target="_blank" rel="noopener" class="gmaps-seg"><span class="gmaps-seg-num">第${idx+1}区間</span><span class="gmaps-seg-lbl">${esc(lk.label)}</span><span class="gmaps-seg-ic">↗</span></a>`;});
  document.getElementById('nav-links').innerHTML=html;
}

// ═══════════ DRIVE MODE ═══════════
const DRV={checked:new Set(),memos:{},completedAt:null};
const MEMO_PRESETS=['不在','少なめ','多め','要確認'];
let drvTimer=null;

// ── Wake Lock ──
let _wakeLock=null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator))return;
  try{_wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
}
function releaseWakeLock(){
  if(_wakeLock){_wakeLock.release();_wakeLock=null;}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&
     document.getElementById('drv-overlay').style.display==='flex') requestWakeLock();
});

// ── 音声読み上げ ──
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=1.05;
  window.speechSynthesis.speak(u);
}

// ── メモ ──
function setMemoChip(i,val){
  DRV.memos[i]=DRV.memos[i]===val?'':val;
  const row=document.getElementById(`drv-memo-row-${i}`);
  if(!row)return;
  row.querySelectorAll('.drv-memo-chip').forEach(c=>c.classList.toggle('active',c.textContent===DRV.memos[i]));
  const inp=document.getElementById(`drv-memo-text-${i}`);
  if(inp) inp.value=MEMO_PRESETS.includes(DRV.memos[i])?'':DRV.memos[i]||'';
}
function onMemoText(i,val){
  DRV.memos[i]=val;
  const row=document.getElementById(`drv-memo-row-${i}`);
  if(row) row.querySelectorAll('.drv-memo-chip').forEach(c=>c.classList.remove('active'));
}

function startDriveMode(){
  DRV.checked=new Set();
  DRV.memos={};
  DRV.completedAt=null;
  document.getElementById('drv-overlay').style.display='flex';
  renderDriveList();
  drvTimer=setInterval(renderDriveList,60000);
  requestWakeLock();
}

function exitDriveMode(){
  document.getElementById('drv-overlay').style.display='none';
  clearInterval(drvTimer);drvTimer=null;
  releaseWakeLock();
}

function toggleDriveStop(i){
  if(DRV.checked.has(i)) DRV.checked.delete(i);
  else DRV.checked.add(i);
  renderDriveList();
}

function completeAndNav(i){
  DRV.checked.add(i);
  if('vibrate' in navigator) navigator.vibrate(80);
  renderDriveList();
  const route=S._driveRoute||[];
  const nextIdx=route.findIndex((_,j)=>!DRV.checked.has(j));
  if(nextIdx<0){speak('全ルート完了です。おつかれさまでした。');return;}
  const ns=route[nextIdx];
  speak(`次は${ns.name}へ`);
  const url=ns.lat
    ?`https://www.google.com/maps/dir/?api=1&destination=${ns.lat},${ns.lng}&travelmode=driving`
    :`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(ns.address)}&travelmode=driving`;
  window.open(url,'_blank');
}

function generateSummaryText(route,completionTime,totalWeight,memoItems){
  const d=new Date();
  const dateStr=`${d.getMonth()+1}月${d.getDate()}日`;
  const absentNames=memoItems.filter(x=>x.memo==='不在').map(x=>x.stop.name);
  let t=`【回収完了レポート】${dateStr}\n`;
  t+=`完了時刻: ${completionTime}\n`;
  t+=`停車地: ${route.length}件\n`;
  if(absentNames.length) t+=`不在: ${absentNames.length}件（${absentNames.join('、')}）\n`;
  if(totalWeight>0) t+=`総収集量: ${totalWeight}kg\n`;
  if(memoItems.length){t+=`\nメモ一覧:\n`;memoItems.forEach(x=>{t+=`・${x.stop.name}: ${x.memo}\n`;});}
  return t;
}

async function copySummary(){
  const text=DRV._summaryText||'';
  if(!text)return;
  try{await navigator.clipboard.writeText(text);}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
  const ok=document.getElementById('drv-copy-ok');
  if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',2000);}
}

function renderDriveList(){
  const route=S._driveRoute||[];
  const done=DRV.checked;
  const total=route.length;
  const remaining=total-done.size;
  const nextIdx=route.findIndex((_,i)=>!done.has(i));
  const pct=total?Math.round((total-remaining)/total*100):0;

  document.getElementById('drv-prog').textContent=`残り ${remaining}/${total}`;
  document.getElementById('drv-prog-fill').style.width=pct+'%';
  if(remaining===0){
    if(!DRV.completedAt) DRV.completedAt=new Date().getHours()*60+new Date().getMinutes();
    const completionTime=m2t(DRV.completedAt);
    const totalWeight=route.reduce((s,st,j)=>s+(DRV.checked.has(j)&&st.weight?parseFloat(st.weight)||0:0),0);
    const memoItems=route.map((st,j)=>({stop:st,memo:DRV.memos[j]||''})).filter(x=>x.memo);
    const absentCount=memoItems.filter(x=>x.memo==='不在').length;
    DRV._summaryText=generateSummaryText(route,completionTime,totalWeight,memoItems);
    document.getElementById('drv-complete').innerHTML=`
      <div class="drv-summary-title">🎉 全ルート完了！おつかれさまでした</div>
      <div class="drv-summary-grid">
        <div class="drv-summary-item"><div class="drv-summary-val">${route.length}件</div><div class="drv-summary-lbl">完了停車地</div></div>
        <div class="drv-summary-item"><div class="drv-summary-val">${absentCount}件</div><div class="drv-summary-lbl">不在</div></div>
        ${totalWeight>0?`<div class="drv-summary-item"><div class="drv-summary-val">${totalWeight}kg</div><div class="drv-summary-lbl">総収集量</div></div>`:''}
        <div class="drv-summary-item"><div class="drv-summary-val">${completionTime}</div><div class="drv-summary-lbl">完了時刻</div></div>
      </div>
      ${memoItems.length?`<div class="drv-summary-notes">${memoItems.map(x=>`<div class="drv-summary-note"><span class="drv-summary-note-name">${esc(x.stop.name)}</span><span class="drv-summary-note-memo">${esc(x.memo)}</span></div>`).join('')}</div>`:''}
      <button class="drv-copy-btn" onclick="copySummary()">📋 テキストでコピー（報告用）</button>
      <div class="drv-copy-ok" id="drv-copy-ok">✅ コピーしました！</div>`;
    document.getElementById('drv-complete').style.display='block';
  } else {
    document.getElementById('drv-complete').style.display='none';
  }

  // フッター（次の停車地）
  const footerInner=document.getElementById('drv-footer-inner');
  if(remaining===0){
    footerInner.innerHTML=`<div class="drv-footer-done">🎉 全ルート完了！おつかれさまでした</div>`;
  } else if(nextIdx>=0){
    const ns=route[nextIdx];
    const nsUrl=ns.lat
      ?`https://www.google.com/maps/dir/?api=1&destination=${ns.lat},${ns.lng}&travelmode=driving`
      :`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(ns.address)}&travelmode=driving`;
    const nsTiming=S._timings?.[nextIdx];
    footerInner.innerHTML=`<div class="drv-footer-next">
      <div class="drv-footer-info">
        <div class="drv-footer-label">▶ 次の停車地 ${nextIdx+1}/${total}</div>
        <div class="drv-footer-name">${esc(ns.name)}</div>
        <div class="drv-footer-sub">${nsTiming?`⏱ ${m2t(nsTiming.arr)} 到着予定`:''}${ns.weight?` · 📦 ${ns.weight}kg`:''}</div>
      </div>
      <a href="${nsUrl}" target="_blank" rel="noopener" class="drv-footer-navbtn">📍 ナビ</a>
    </div>`;
  }

  let html='';
  route.forEach((stop,i)=>{
    const isDone=done.has(i);
    const isNext=i===nextIdx;
    const navUrl=stop.lat
      ?`https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}&travelmode=driving`
      :`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(stop.address)}&travelmode=driving`;
    const tw=stop.twEnd?(stop.twStart?stop.twStart+'〜':'')+stop.twEnd+'まで':(stop.templateTime?'🕐 '+stop.templateTime:'');
    const timing=S._timings?.[i];
    const nowMin=new Date().getHours()*60+new Date().getMinutes();
    const isLate=!isDone&&timing&&nowMin>timing.arr;
    const infoHtml=`
        <div class="drv-num">${i+1}番目</div>
        <div class="drv-name">${esc(stop.name)}</div>
        <div class="drv-addr">${esc(stop.address)}</div>
        ${tw?`<div class="drv-tw">⏰ ${esc(tw)}</div>`:''}
        ${timing?`<div class="drv-arr${isLate?' drv-arr-late':''}">⏱ ${m2t(timing.arr)} 到着予定${isLate?' ⚠️ 遅延中':''}</div>`:''}
        ${isLate&&!isNext?`<div class="drv-late-badge">⚠️ 予定時刻を過ぎています</div>`:''}
        ${stop.notes?`<div class="drv-notes">📝 ${esc(stop.notes)}</div>`:''}
        ${stop.weight?`<div class="drv-weight">📦 ${stop.weight}kg</div>`:''}`;
    const memoVal=DRV.memos[i]||'';
    const memoHtml=isDone?`<div class="drv-memo-row" id="drv-memo-row-${i}">
      <div class="drv-memo-chips">${MEMO_PRESETS.map(p=>`<button class="drv-memo-chip${memoVal===p?' active':''}" onclick="setMemoChip(${i},'${p}')">${p}</button>`).join('')}</div>
      <input class="drv-memo-input" id="drv-memo-text-${i}" type="text" placeholder="その他メモ（任意）"
        value="${MEMO_PRESETS.includes(memoVal)?'':memoVal.replace(/"/g,'&quot;')}"
        oninput="onMemoText(${i},this.value)">
    </div>`:'';
    if(isNext){
      html+=`<div class="drv-item drv-next${isLate?' drv-late':''}" id="drv-i-${i}">
        <div class="drv-next-row">
          <button class="drv-chk" onclick="toggleDriveStop(${i})"></button>
          <div class="drv-info">${infoHtml}</div>
          <a href="${navUrl}" target="_blank" rel="noopener" class="drv-nav-btn drv-nav-next"><span>📍</span>ナビ</a>
        </div>
        <button class="drv-complete-btn" onclick="completeAndNav(${i})">📦 回収完了 → 次の停車地へナビ</button>
      </div>`;
    } else {
      html+=`<div class="drv-item${isDone?' drv-done':''}${isLate?' drv-late':''}" id="drv-i-${i}">
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
          <button class="drv-chk${isDone?' drv-chk-on':''}" onclick="toggleDriveStop(${i})">${isDone?'✓':''}</button>
          ${isDone?`<div class="drv-undo">↩取消</div>`:''}
        </div>
        <div style="flex:1;min-width:0;"><div class="drv-info">${infoHtml}</div>${memoHtml}</div>
        <a href="${navUrl}" target="_blank" rel="noopener" class="drv-nav-btn"><span>📍</span>ナビ</a>
      </div>`;
    }
  });
  document.getElementById('drv-list').innerHTML=html;
  if(nextIdx>=0){
    const el=document.getElementById(`drv-i-${nextIdx}`);
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),80);
  }
}

async function addLocation(){
  const name=document.getElementById('m-name').value.trim(),addr=document.getElementById('m-addr').value.trim(),notes=document.getElementById('m-notes').value.trim();
  const msg=document.getElementById('m-msg');
  if(!name||!addr){msg.innerHTML='<div class="alert alert-e">拠点名と住所は必須です</div>';return;}
  msg.innerHTML='<div class="alert alert-i">住所を確認中...</div>';
  try{
    const gc=await geocode(addr);
    S.locs.push({id:'u_'+Date.now(),name,address:addr,notes,lat:gc.lat,lng:gc.lng});
    saveStorage();renderMaster();
    ['m-name','m-addr','m-notes'].forEach(id=>document.getElementById(id).value='');
    msg.innerHTML=`<div class="alert alert-s">✅「${esc(name)}」を登録しました</div>`;
    setTimeout(()=>{msg.innerHTML='';},3000);
  }catch(e){msg.innerHTML=`<div class="alert alert-e">❌ ${esc(e.message)}</div>`;}
}
function deleteLoc(id){
  const loc=S.locs.find(l=>l.id===id);
  if(!loc||!confirm(`「${loc.name}」を削除しますか？`))return;
  S.locs=S.locs.filter(l=>l.id!==id);
  S.stops=S.stops.filter(s=>s.id!==id);
  saveStorage();renderMaster();renderSel();
}

// ═══════════ TEMPLATE LIST VIEW ═══════════
function renderTemplateList(){
  if(!SACURE_DATA?.routes)return;
  const el=document.getElementById('template-list');
  const byDriver={};
  for(const r of SACURE_DATA.routes){
    if(!byDriver[r.driver])byDriver[r.driver]=[];
    byDriver[r.driver].push(r);
  }
  let html='';
  for(const [driver,routes] of Object.entries(byDriver).sort((a,b)=>a[0].localeCompare(b[0],'ja'))){
    html+=`<div class="card"><div class="card-ttl">${esc(driver)}</div>`;
    routes.sort((a,b)=>(DAY_ORDER[a.day]||9)-(DAY_ORDER[b.day]||9));
    for(const r of routes){
      html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
        <div>
          <span class="badge bdg-amber" style="margin-right:6px;">${r.day}曜日</span>
          <span style="font-size:.85rem;font-weight:700;color:var(--navy);">${r.stops.length}件</span>
          ${r.stops[0]?.time?`<span style="font-size:.72rem;color:var(--gray);margin-left:6px;">${r.stops[0].time}〜</span>`:''}
        </div>
        <button class="btn btn-pink btn-sm" onclick="quickLoad('${r.driver}','${r.day}')">今日使う</button>
      </div>`;
    }
    html+='</div>';
  }
  el.innerHTML=html;
}
function quickLoad(driver,day){
  document.getElementById('tpl-driver').value=driver;
  onDriverChange();
  document.getElementById('tpl-day').value=day;
  loadTemplate();
  switchTab('route');
}

// ═══════════ TABS ═══════════
function switchTab(tab){
  ['route','master','templates'].forEach((t,i)=>{
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active',t===tab);
    document.getElementById(`view-${t}`).classList.toggle('active',t===tab);
  });
}

// ═══════════ UTIL ═══════════
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ═══════════ INIT ═══════════
function init(){
  loadStorage();
  importMasterData();
  renderMaster();
  populateDriverSel();
  renderTemplateList();
}
init();

// 検索ボックス外クリックで候補を閉じる
document.addEventListener('click',e=>{
  if(!e.target.closest('.stop-search'))document.getElementById('stop-search-res').style.display='none';
  if(!e.target.closest('#end-master-wrap'))document.getElementById('end-master-res').style.display='none';
});
</script>
